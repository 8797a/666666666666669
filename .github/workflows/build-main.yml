name: Build Main Platforms

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'beta'
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install Inno Setup
      run: choco install innosetup -y
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Install intl_utils
      run: dart pub global activate intl_utils
    
    - name: Generate localization
      run: dart pub global run intl_utils:generate
    
    - name: Build Windows amd64
      run: dart setup.dart windows --arch amd64 --env stable
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlClash-Windows-amd64
        path: dist/**/*
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'beta'
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Install intl_utils
      run: dart pub global activate intl_utils
    
    - name: Generate localization
      run: dart pub global run intl_utils:generate
    
    - name: Build Linux amd64
      run: dart setup.dart linux --arch amd64 --env stable
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlClash-Linux-amd64
        path: dist/**/*
        retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'beta'
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26d
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Install intl_utils
      run: dart pub global activate intl_utils
    
    - name: Generate localization
      run: dart pub global run intl_utils:generate
    
    - name: Build Android arm64-v8a
      run: dart setup.dart android --arch arm64-v8a --env stable
    
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlClash-Android-arm64-v8a
        path: dist/**/*
        retention-days: 30

  create-release:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Display structure
      run: ls -R artifacts
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## 📦 支持平台
          
          - ✅ **Windows** (amd64) - 未签名，安装时会有警告，选择"仍要运行"即可
          - ✅ **Linux** (amd64) - 无需签名，直接安装使用
          - ✅ **Android** (arm64-v8a) - 调试版 APK，需允许"未知来源"
          
          ## 📝 安装说明
          
          ### Windows
          1. 下载 `.exe` 安装程序
          2. 双击运行
          3. 如果出现"Windows 已保护你的电脑"警告：
             - 点击"更多信息"
             - 点击"仍要运行"
          4. 按照向导完成安装
          
          ### Linux
          1. 下载 amd64 架构的安装包：
             - `.deb` - Debian/Ubuntu 系统
             - `.rpm` - RedHat/Fedora 系统
             - `.AppImage` - 通用格式
          2. 安装：
             ```bash
             # Debian/Ubuntu
             sudo dpkg -i FlClash-*.deb
             
             # RedHat/Fedora
             sudo rpm -i FlClash-*.rpm
             
             # AppImage
             chmod +x FlClash-*.AppImage
             ./FlClash-*.AppImage
             ```
          
          ### Android
          1. 下载 arm64-v8a 架构的 APK（适用于现代手机）
          2. 传输到手机并安装
          3. 如果提示"禁止安装未知应用"：
             - 点击"设置"
             - 打开"允许来自此来源的应用"
             - 返回继续安装
          4. 点击"安装"
          
          ## ⚠️ 注意事项
          
          - 所有版本均为**未签名或调试签名**版本
          - 功能完整，可以正常使用
          - 不影响软件的任何功能
          - 如需签名版本，请自行配置证书并编译
          
          ## 🔧 硬件绑定功能
          
          本版本已集成硬件绑定功能，用于设备验证：
          - Windows: 获取 CPU、主板、硬盘、BIOS UUID
          - Linux: 获取系统硬件信息
          - Android: 获取设备序列号和 Android ID
          
          详见项目文档了解更多信息。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
