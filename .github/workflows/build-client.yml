name: Build Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set submodule HTTPS URLs
        shell: pwsh
        run: |
          git config submodule.core/Clash.Meta.url https://github.com/chen08209/Clash.Meta.git
          git config submodule.plugins/flutter_distributor.url https://github.com/chen08209/flutter_distributor.git
          git config submodule.plugins/tray_manager.url https://github.com/chen08209/tray_manager.git
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Windows core
        run: dart setup.dart windows --arch amd64 --out core --env stable

      - name: Build Windows app
        shell: pwsh
        run: |
          Remove-Item -Path build\windows -Recurse -Force -ErrorAction SilentlyContinue
          $env:CMAKE_GENERATOR = 'Visual Studio 17 2022'
          flutter build windows --release --dart-define-from-file=env.json

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          if (Test-Path build\windows\x64\runner\Release) {
            Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath artifacts\FlClash-Windows-Release.zip -Force
          }
          if (Test-Path dist) {
            Get-ChildItem -Path dist -Recurse -File -Include *.exe,*.zip,*.msix,*.msi | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination artifacts -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not (Get-ChildItem -Path artifacts -File -Recurse -ErrorAction SilentlyContinue)) {
            Write-Host "No Windows artifacts found. Listing build outputs for debug:"
            Get-ChildItem -Path build -Recurse -File -ErrorAction SilentlyContinue | Select-Object FullName,Length | Out-String -Width 240
            exit 1
          }
          Get-ChildItem -Path artifacts -Recurse -Force | Select-Object FullName,Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Windows
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set submodule HTTPS URLs
        run: |
          git config submodule.core/Clash.Meta.url https://github.com/chen08209/Clash.Meta.git
          git config submodule.plugins/flutter_distributor.url https://github.com/chen08209/flutter_distributor.git
          git config submodule.plugins/tray_manager.url https://github.com/chen08209/tray_manager.git
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/go.sum

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          add-to-path: true

      - name: Configure Android SDK
        run: |
          flutter config --android-sdk "$ANDROID_HOME"
          flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        run: dart setup.dart android --arch arm64-v8a --env stable
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false

      - name: Collect Android artifacts
        run: |
          mkdir -p artifacts
          if [ -d dist ]; then cp -R dist/. artifacts/; fi
          find . -path ./.git -prune -o -name "*.apk" -type f -exec cp {} artifacts/ \; 2>/dev/null || true
          find . -path ./.git -prune -o -name "*.aab" -type f -exec cp {} artifacts/ \; 2>/dev/null || true
          if ! find artifacts -type f | grep -q .; then
            echo "No Android artifacts found. Listing build outputs for debug:"
            find build -type f | sed 's#^#  #' || true
            exit 1
          fi
          find artifacts -type f -print

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Android-arm64-v8a
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.arch == 'amd64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set submodule HTTPS URLs
        run: |
          git config submodule.core/Clash.Meta.url https://github.com/chen08209/Clash.Meta.git
          git config submodule.plugins/flutter_distributor.url https://github.com/chen08209/flutter_distributor.git
          git config submodule.plugins/tray_manager.url https://github.com/chen08209/tray_manager.git
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/go.sum

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare macOS core
        run: dart setup.dart macos --arch ${{ matrix.arch }} --env stable --out core

      - name: Build macOS app
        run: |
          set -e
          if flutter build macos --help | grep -q -- '--no-codesign'; then
            flutter build macos --release --dart-define-from-file=env.json --no-codesign
          else
            flutter build macos --release --dart-define-from-file=env.json
          fi

      - name: Package macOS app
        run: |
          set -e
          mkdir -p artifacts
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "No .app bundle found"
            ls -R build/macos/Build/Products || true
            exit 1
          fi
          codesign --force --deep --sign - "$APP" || echo "codesign skipped"
          xattr -cr "$APP" || true
          ditto -c -k --keepParent "$APP" "artifacts/FlClash-macOS-${{ matrix.arch }}.zip"
          shasum -a 256 "artifacts/FlClash-macOS-${{ matrix.arch }}.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-macOS-${{ matrix.arch }}
          path: artifacts/**
          if-no-files-found: error
          retention-days: 30
