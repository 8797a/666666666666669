name: Build Windows

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'beta'
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache-dependency-path: core/go.sum
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install Inno Setup
      run: choco install innosetup -y
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Install intl_utils
      run: dart pub global activate intl_utils
    
    - name: Generate localization
      run: dart pub global run intl_utils:generate
    
    - name: Build Windows amd64
      run: |
        dart setup.dart windows --arch amd64 --env stable
        if (-not (Test-Path dist)) {
          Write-Error "Build failed: dist directory not found"
          exit 1
        }
    
    - name: List build output
      run: |
        echo "=== Listing current directory ==="
        dir
        echo "=== Listing dist directory ==="
        if (Test-Path dist) { dir dist } else { echo "dist directory not found" }
        echo "=== Finding all EXE and ZIP files ==="
        Get-ChildItem -Path dist -Filter *.exe -Recurse -ErrorAction SilentlyContinue
        Get-ChildItem -Path dist -Filter *.zip -Recurse -ErrorAction SilentlyContinue
    
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlClash-Windows-amd64
        path: dist/**/*
        retention-days: 30
