name: Build Android

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free Disk Space
      run: |
        echo "=== Before cleanup ==="
        df -h
        echo "=== Cleaning up ==="
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/.ghcup
        sudo docker image prune --all --force
        sudo apt-get clean
        echo "=== After cleanup ==="
        df -h
    
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'beta'
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache-dependency-path: core/go.sum
    
    - name: Setup Android NDK
      run: |
        echo "=== Downloading Android NDK ==="
        NDK_VERSION="27.3.13750724"
        NDK_URL="https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
        wget -q $NDK_URL -O ndk.zip
        echo "=== Extracting NDK ==="
        unzip -q ndk.zip
        NDK_DIR="$PWD/android-ndk-r27c"
        echo "=== Setting environment variables ==="
        echo "ANDROID_NDK=$NDK_DIR" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
        echo "=== Verifying NDK installation ==="
        ls -la "$NDK_DIR"
        if [ -f "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
          echo "NDK installed successfully"
        else
          echo "ERROR: clang not found"
          exit 1
        fi
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Configure Gradle
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
        echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
        echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
    
    - name: Install intl_utils
      run: dart pub global activate intl_utils
    
    - name: Generate localization
      run: dart pub global run intl_utils:generate
    
    - name: Verify build environment
      run: |
        echo "=== Flutter doctor ==="
        flutter doctor -v
        echo "=== Java version ==="
        java -version
        echo "=== Android SDK location ==="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "=== NDK environment variables ==="
        echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
        echo "ANDROID_NDK: $ANDROID_NDK"
        echo "=== NDK directory structure ==="
        if [ -d "$ANDROID_NDK" ]; then
          ls -la "$ANDROID_NDK"
          if [ -d "$ANDROID_NDK/toolchains/llvm/prebuilt" ]; then
            echo "=== Prebuilt toolchains ==="
            ls -la "$ANDROID_NDK/toolchains/llvm/prebuilt"
          fi
        fi
        echo "=== Configuring Flutter Android SDK ==="
        flutter config --android-sdk /usr/local/lib/android/sdk
        flutter doctor -v
    
    - name: Build Android arm64-v8a
      run: dart setup.dart android --arch arm64-v8a --env stable
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    - name: Clean build cache
      run: |
        echo "=== Cleaning Gradle cache ==="
        rm -rf ~/.gradle/caches
        rm -rf ~/.gradle/wrapper
        echo "=== Disk space after build ==="
        df -h
    
    - name: List build output
      run: |
        echo "=== Listing current directory ==="
        ls -la
        echo "=== Listing dist directory ==="
        ls -la dist/ || echo "dist directory not found"
        echo "=== Finding all APK files ==="
        find . -name "*.apk" || echo "No APK files found"
    
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlClash-Android-arm64-v8a
        path: dist/**/*
        retention-days: 30
