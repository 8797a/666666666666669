name: Build Android

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free Disk Space
      run: |
        echo "=== Before cleanup ==="
        df -h
        echo "=== Cleaning up ==="
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/.ghcup
        sudo docker image prune --all --force
        sudo apt-get clean
        echo "=== After cleanup ==="
        df -h
    
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'beta'
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache-dependency-path: core/go.sum
    
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27c
        add-to-path: true
    
    - name: Verify NDK installation
      run: |
        echo "=== Checking NDK installation ==="
        echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
        echo "ANDROID_NDK: $ANDROID_NDK"
        if [ -d "$ANDROID_NDK_HOME" ]; then
          echo "=== NDK root directory ==="
          ls -la "$ANDROID_NDK_HOME"
          echo "=== NDK toolchains directory ==="
          if [ -d "$ANDROID_NDK_HOME/toolchains" ]; then
            ls -la "$ANDROID_NDK_HOME/toolchains"
            if [ -d "$ANDROID_NDK_HOME/toolchains/llvm" ]; then
              ls -la "$ANDROID_NDK_HOME/toolchains/llvm"
              if [ -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" ]; then
                ls -la "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt"
              else
                echo "prebuilt directory not found"
              fi
            else
              echo "llvm directory not found"
            fi
          else
            echo "toolchains directory not found"
          fi
        else
          echo "ANDROID_NDK_HOME not found"
        fi
        echo "=== Setting ANDROID_NDK environment variable ==="
        echo "ANDROID_NDK=$ANDROID_NDK_HOME" >> $GITHUB_ENV
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Configure Gradle
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
        echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
        echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
    
    - name: Install intl_utils
      run: dart pub global activate intl_utils
    
    - name: Generate localization
      run: dart pub global run intl_utils:generate
    
    - name: Verify build environment
      run: |
        echo "=== Flutter doctor ==="
        flutter doctor -v
        echo "=== Java version ==="
        java -version
        echo "=== NDK environment variables ==="
        echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
        echo "ANDROID_NDK: $ANDROID_NDK"
        echo "=== NDK directory structure ==="
        if [ -d "$ANDROID_NDK_HOME" ]; then
          ls -la "$ANDROID_NDK_HOME"
          echo "=== NDK toolchains ==="
          ls -la "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/" || echo "Prebuilt directory not found"
        else
          echo "ANDROID_NDK_HOME directory not found"
        fi
    
    - name: Build Android arm64-v8a
      run: dart setup.dart android --arch arm64-v8a --env stable
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false"
    
    - name: Clean build cache
      run: |
        echo "=== Cleaning Gradle cache ==="
        rm -rf ~/.gradle/caches
        rm -rf ~/.gradle/wrapper
        echo "=== Disk space after build ==="
        df -h
    
    - name: List build output
      run: |
        echo "=== Listing current directory ==="
        ls -la
        echo "=== Listing dist directory ==="
        ls -la dist/ || echo "dist directory not found"
        echo "=== Finding all APK files ==="
        find . -name "*.apk" || echo "No APK files found"
    
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlClash-Android-arm64-v8a
        path: dist/**/*
        retention-days: 30
