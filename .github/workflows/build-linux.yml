name: Build Linux

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'beta'
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Install intl_utils
      run: dart pub global activate intl_utils
    
    - name: Generate localization
      run: dart pub global run intl_utils:generate
    
    - name: Build Linux amd64
      run: dart setup.dart linux --arch amd64 --env stable
    
    - name: List build output
      run: |
        echo "=== Listing current directory ==="
        ls -la
        echo "=== Listing dist directory ==="
        ls -la dist/ || echo "dist directory not found"
        echo "=== Finding all files ==="
        find . -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" || echo "No build artifacts found"
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlClash-Linux-amd64
        path: dist/**/*
        retention-days: 30
