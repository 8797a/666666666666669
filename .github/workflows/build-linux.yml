name: Build Linux

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'beta'
    
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache-dependency-path: core/go.sum
    
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
        sudo apt-get install -y dpkg-dev fakeroot
    
    - name: Install dependencies
      run: flutter pub get
    
    - name: Install intl_utils
      run: dart pub global activate intl_utils
    
    - name: Generate localization
      run: dart pub global run intl_utils:generate
    
    - name: Build Linux amd64
      run: dart setup.dart linux --arch amd64 --env stable
    
    - name: List build output
      run: |
        echo "=== Listing current directory ==="
        ls -la
        echo "=== Listing dist directory ==="
        if [ -d "dist" ]; then ls -la dist; else echo "dist directory not found"; fi
        echo "=== Finding all DEB and TAR.GZ files ==="
        find dist -name "*.deb" -o -name "*.tar.gz" 2>/dev/null || true
    
    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FlClash-Linux-amd64
        path: dist/**/*
        retention-days: 30
